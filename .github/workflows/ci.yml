name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: production

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: corepack prepare pnpm@10.29.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: corepack prepare pnpm@10.29.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run type-check
      - run: pnpm --filter server run build

  test:
    runs-on: ubuntu-latest
    needs: [lint-and-format, type-check]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: corepack prepare pnpm@10.29.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run test:coverage
      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: [type-check]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: corepack prepare pnpm@10.29.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm --filter server run build
      - run: node -e "const fs=require('fs');fs.writeFileSync('version.txt',require('./package.json').version+'\n')"
      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: client-dist
          path: dist/
          retention-days: 30
      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: server-dist
          path: server/dist/
          retention-days: 30
      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: version
          path: version.txt
          retention-days: 30
      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: changelog
          path: CHANGELOG.md
          retention-days: 30

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: corepack prepare pnpm@10.29.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - uses: github/codeql-action/init@b2dfba2baa88b44c5c1f4e030f114b225d4084c1
        with:
          languages: javascript, typescript
      - run: pnpm run build
      - run: pnpm --filter server run build
      - uses: github/codeql-action/analyze@b2dfba2baa88b44c5c1f4e030f114b225d4084c1
      - uses: zricethezav/gitleaks-action@aa6c132071730e14d28e89080e0adeebc4df4512
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
