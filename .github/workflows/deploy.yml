name: Deploy client to GitHub Pages

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare client env
        run: |
          printf 'VITE_FIREBASE_API_KEY=%s\n' '${{ secrets.VITE_FIREBASE_API_KEY }}' > .env
          printf 'VITE_FIREBASE_AUTH_DOMAIN=%s\n' '${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}' >> .env
          printf 'VITE_FIREBASE_PROJECT_ID=%s\n' '${{ secrets.VITE_FIREBASE_PROJECT_ID }}' >> .env
          printf 'VITE_SERVER_URL=%s\n' '${{ secrets.VITE_SERVER_URL || 'https://karkasson.onrender.com' }}' >> .env

      - name: Build client
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
