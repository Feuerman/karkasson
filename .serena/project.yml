project_name: "karkasson"

language_servers:
  - typescript
  - vue
  - json
  - scss
  - yaml
  - markdown
  - html

encoding: "utf-8"
ignore_all_files_in_gitignore: true
ls_workspace_folders:
  - "."
ignored_paths:
  - "dist/**"
  - "server/dist/**"
  - "coverage/**"
  - "test-results/**"
  - "playwright-report/**"
initial_prompt: >-
  Karkasson is a pnpm-workspace Carcassonne game with a Vue 3 client in src/ and
  a Node.js/Socket.IO server in server/. The server owns game state, rules,
  validation, and scoring; the client displays server state and sends player
  intents. The shared domain model and tile catalog live in server/src/ and are
  imported by the client. Firebase Realtime Database stores production saves;
  development and tests use in-memory storage. Read AGENTS.md for repository
  invariants and verification requirements, and README.md for architecture and
  setup.
